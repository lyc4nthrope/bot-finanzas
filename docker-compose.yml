# Local development stack. Secrets come from .env (never committed).
services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.43.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost only; Discord reaches it through the tunnel.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
    volumes:
      - n8n_data:/home/node/.n8n

  # n8n running locally against the PRODUCTION state in Supabase (schema n8n).
  # Used to create the owner account, credentials and workflows before the cloud
  # instance starts, so its setup page is never publicly claimable.
  # Start with: scripts/cloud-n8n.sh up   (it derives the Supabase variables)
  n8n-cloud:
    # Same image as production (deploy/Dockerfile): trusts the Supabase CA.
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: bot-finanzas-n8n:local
    profiles: ["cloud"]
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${SUPABASE_DB_HOST}
      DB_POSTGRESDB_PORT: ${SUPABASE_DB_PORT}
      DB_POSTGRESDB_DATABASE: ${SUPABASE_DB_NAME}
      DB_POSTGRESDB_USER: ${CLOUD_N8N_DB_USER:-}
      DB_POSTGRESDB_PASSWORD: ${DB_N8N_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_SSL_ENABLED: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_URL: ${CLOUD_WEBHOOK_URL:-}
      NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      # Successful runs contain amounts; keep only failed executions for debugging.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      N8N_LOG_LEVEL: ${CLOUD_LOG_LEVEL:-info}

  # Temporary public HTTPS URL for local testing (no Cloudflare account needed).
  # The URL changes on every start; read it with: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - n8n
    command: tunnel --no-autoupdate --url http://n8n:5678

volumes:
  postgres_data:
  n8n_data:
